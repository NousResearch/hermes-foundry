name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production document test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run Python tests without skips
        run: python scripts/run-python-tests.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build Foundry edge
        run: dotnet build src/edge/HelloWorldA365Agent.sln --configuration Release --nologo

      - name: Validate shell scripts
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')

      - name: Validate Bicep templates
        run: az bicep build --file infra/main.bicep --stdout >/dev/null

      - name: Reject private artifacts and credentials
        run: python scripts/audit-public-tree.py
