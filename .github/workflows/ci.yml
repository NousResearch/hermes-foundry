name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install production document test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run Python tests without skips
        run: python scripts/run-python-tests.py

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "9.0.x"

      - name: Build Foundry edge
        run: dotnet build src/edge/HelloWorldA365Agent.sln --configuration Release --nologo

      - name: Run Foundry edge contract tests
        run: dotnet test tests/edge/HelloWorldA365Agent.Tests.csproj --configuration Release --nologo

      - name: Validate shell scripts
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')

      - name: Validate Bicep templates
        run: az bicep build --file infra/main.bicep --stdout >/dev/null

      - name: Reject private artifacts and credentials
        run: python scripts/audit-public-tree.py
